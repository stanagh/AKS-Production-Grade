trigger: 
  branches:
    include:
      - main
  paths:
    include:
      - AttendanceCRM/**

pool: 
  vmImage: 'ubuntu-latest'

variables: 
  - group: terraform-secrets
  - name: RESOURCE_GROUP
    value: 'rg-prod-uks-aks'
  - name: AKS_CLUSTER_NAME
    value: 'aks-prod-uks-myapp'
  - name: ACR_NAME
    value: 'acrproduksaks'
  - name: IMAGE_NAME
    value: attendancecrm
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
  - stage: Test
    jobs:
      - job: UnitTests
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 6 SDK'
            inputs:
              packageType: sdk
              version: 6.x
          
          - task: UseDotNet@2
            displayName: 'Install .NET 8 SDK'
            inputs:
              packageType: sdk
              version: 8.x

          - script: dotnet test AttendanceCRM/AttendanceCRM.Test/AttendanceCRM.Test.csproj
            displayName: Run Unit Tests

          - script: dotnet test AttendanceCRM/TestProject1/TestProject1.csproj
            displayName: Run TestProject Tests

  - stage: Build
    dependsOn: Test
    jobs:
      - job: BuildAndPush
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: service-connection-subscription
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(ACR_NAME)
                docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG) ./AttendanceCRM
                docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)
            displayName: Build and Push to ACR
  
  - stage: Security
    displayName: Security Scan
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TrivyScan
        displayName: Trivy Image Scan
        steps:
          - task: AzureCLI@2
            displayName: Scan Image with Trivy
            continueOnError: true  
            inputs:
              azureSubscription: service-connection-subscription
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

                az acr login --name acrproduksaks

                trivy image \
                  --exit-code 0 \
                  --severity LOW,MEDIUM,HIGH,CRITICAL \
                  --format table \
                  $(ACR_NAME).azurecr.io/attendancecrm:$(IMAGE_TAG)

  - stage: Deploy
    dependsOn: Security
    jobs:
      - job: UpdateImageTag
        steps:
          - checkout: self
            persistCredentials: true 
          - task: AzureCLI@2
            displayName: Update Image Tag in Git
            inputs:
              azureSubscription: service-connection-subscription
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                git config user.email "ado@pipeline.com"
                git config user.name "ADO Pipeline"
                
                git checkout main

                sed -i "s|attendancecrm:.*|attendancecrm:$(IMAGE_TAG)|g" terraform/app/deployment.yml
                
                git add terraform/app/deployment.yml
                git commit -m "ci: update image tag to $(IMAGE_TAG) [skip ci]"
                git push origin main
  
  - stage: Review
    dependsOn: Deploy
    jobs:
      - job: VerifyAKSDeployment
        displayName: Verify Deployment
        steps:
        - checkout: self
        - task: AzureCLI@2
          displayName: Verify AKS Deployment
          inputs:
            azureSubscription: service-connection-subscription
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az aks get-credentials --resource-group $(RESOURCE_GROUP) --name $(AKS_CLUSTER_NAME) --overwrite-existing
              kubectl get pods -n attendance-crm
              kubectl get svc -n attendance-crm
              kubectl get ingress -n attendance-crm
              kubectl get pods -n monitoring
              kubectl rollout status deployment/attendancecrm-deployment -n attendance-crm
              
  - stage: Notify
    dependsOn: Review
    condition: always() 
    jobs:
      - job: SlackNotification
        steps:
          - script: |
              STATUS="✅ Success"
              if [ "$(Agent.JobStatus)" == "Failed" ]; then
                STATUS="❌ Failed"
              fi
              curl -X POST $(SLACK_WEBHOOK_URL) \
                -H 'Content-type: application/json' \
                --data "{
                  \"text\": \"*AttendanceCRM Deployment*\n Status: $STATUS\n Build: $(Build.BuildId)\n Branch: $(Build.SourceBranchName)\"
                }"
            displayName: Send Slack Notification