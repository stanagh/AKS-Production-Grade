apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: attendance-crm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stanagh/AKS-Production-Grade.git
    targetRevision: main
    path: terraform/app
  destination:
    server: https://kubernetes.default.svc
    namespace: attendance-crm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true