prometheus:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - prometheus.attendanceappservice.online
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.attendanceappservice.online
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 800Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.attendanceappservice.online
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.attendanceappservice.online
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  env:
    GF_SECURITY_ADMIN_USER: admin
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 600Mi
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  extraVolumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: grafana-keyvault
  extraVolumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets"
      readOnly: true
  podLabels:
    azure.workload.identity/use: "true"

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true